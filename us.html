<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美股注意力儀表板</title>
<style>
  :root{
    --bg:#0e1117; --card:#161b22; --card2:#1c2230; --line:#2a3240;
    --txt:#e6edf3; --mut:#8b949e; --dim:#6e7681;
    --green:#16c784; --red:#ea3943; --blue:#3b82f6; --amber:#f0b90b; --r:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--txt);padding:16px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5;}
  .wrap{max-width:720px;margin:0 auto;}
  h1{font-size:18px;font-weight:600;margin:0 0 2px;}
  .sub{font-size:12px;color:var(--mut);margin:0 0 14px;}
  .tfseg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0 0 6px;}
  .tfseg button{flex:1;background:var(--card);color:var(--mut);border:none;padding:10px 4px;font-size:14px;font-weight:600;cursor:pointer;}
  .tfseg button.on{background:var(--card2);color:#7eb6ff;}
  .tfseg button small{display:block;font-size:10px;font-weight:400;color:var(--dim);}
  .time{font-size:11px;color:var(--dim);margin:0 0 10px;}
  .status{font-size:13px;color:var(--mut);padding:16px 0;}
  .head,.row{display:grid;grid-template-columns:44px minmax(0,1fr) 80px 88px;gap:8px;align-items:center;
    padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px;}
  .head{color:var(--dim);font-weight:600;font-size:11px;position:sticky;top:0;background:var(--bg);z-index:1;}
  .head span:nth-child(n+3){text-align:right;}
  .row.hot{background:rgba(240,185,11,.08);border-left:3px solid var(--amber);padding-left:3px;}
  .rkc{text-align:center;line-height:1.2;}
  .rkc .rk{color:var(--txt);font-weight:600;}
  .rkc .mv{display:block;font-size:10px;font-weight:700;}
  .mv.up{color:var(--green);} .mv.dn{color:var(--red);} .mv.flat{color:var(--dim);} .mv.new{color:var(--amber);}
  .namec{min-width:0;line-height:1.3;}
  .namec .sym{font-weight:700;}
  .namec .nm{display:block;color:var(--mut);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pricec{text-align:right;line-height:1.3;}
  .pricec .px{font-weight:600;}
  .pricec .ch{display:block;font-size:11px;font-weight:600;}
  .pos{color:var(--green);} .neg{color:var(--red);}
  .dv{text-align:right;font-weight:600;}
  .foot{font-size:11px;color:var(--dim);margin-top:16px;line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <h1>美股注意力儀表板</h1>
  <p class="sub">成交金額排行 — 看今天誰在爆量。熱度榜，不是買賣訊號。</p>
  <div class="tfseg" id="tf">
    <button class="on" data-w="1d">當日<small>最近交易日</small></button>
    <button data-w="7d">7 日均<small>近 7 交易日</small></button>
    <button data-w="21d">21 日均<small>近 21 交易日</small></button>
  </div>
  <div class="time" id="time"></div>
  <div class="head"><span>#</span><span>代號 / 名稱</span><span>價格 / 日漲跌</span><span>成交金額</span></div>
  <div id="status" class="status">載入中…</div>
  <div id="list"></div>
  <p class="foot" id="foot">箭頭＝與前一交易日排名相比的變化；NEW＝新進榜（前一日在 40 名外）；排名竄升 10 名以上整列高亮。
    成交金額＝收盤價×成交量；7 日均 / 21 日均為該期間平均每日成交金額。
    資料每日美股收盤後更新 · Yahoo Finance · 僅供研究參考，非投資建議。</p>
</div>
<script>
(function(){
  function $(id){return document.getElementById(id);}
  var DATA=null, W='1d';
  function fmt(x){ if(x>=1e9)return '$'+(x/1e9).toFixed(1)+'B'; if(x>=1e6)return '$'+(x/1e6).toFixed(0)+'M'; return '$'+Math.round(x); }
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function taipei(iso){
    try{ return new Date(iso).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}); }
    catch(e){ return iso; }
  }
  // 取歷史裡最新日的前一個交易日，回傳該窗口的 symbol→rank 對照
  function prevRanks(w){
    var h=DATA&&DATA.history; if(!h) return null;
    var dates=Object.keys(h).sort();
    if(dates.length<2) return null;
    var prev=h[dates[dates.length-2]]; if(!prev||!prev[w]) return null;
    var m={}; prev[w].forEach(function(s,i){ m[s]=i+1; });
    return m;
  }
  function render(){
    if(!DATA) return;
    var rows=DATA[W]||[];
    var pv=prevRanks(W);
    $('time').textContent='資料日 '+(DATA.latest_date||'')+' · 更新於 '+taipei(DATA.updated)+' 台北時間'+(DATA.universe?(' · 掃描 '+DATA.universe+' 檔'):'');
    if(!rows.length){ $('list').innerHTML='<div class="status">暫無資料</div>'; return; }
    $('list').innerHTML=rows.map(function(x){
      var mv='<span class="mv flat">–</span>', hot=false;
      if(pv){
        var p=pv[x.sym];
        if(p==null){ mv='<span class="mv new">NEW</span>'; hot=(x.rank<=31); }        // 前一日 41 名外 → 至少升 10 名才高亮
        else{
          var d=p-x.rank;
          if(d>0){ mv='<span class="mv up">&#8593;'+d+'</span>'; hot=(d>=10); }
          else if(d<0){ mv='<span class="mv dn">&#8595;'+(-d)+'</span>'; }
        }
      }
      var chCls=(x.chg==null?'':(x.chg>=0?'pos':'neg'));
      var ch=(x.chg==null?'—':((x.chg>=0?'+':'')+x.chg+'%'));
      return '<div class="row'+(hot?' hot':'')+'">'+
        '<span class="rkc"><span class="rk">'+x.rank+'</span>'+mv+'</span>'+
        '<span class="namec"><span class="sym">'+esc(x.sym)+'</span><span class="nm">'+esc(x.name||'')+'</span></span>'+
        '<span class="pricec"><span class="px">'+(x.last==null?'—':x.last)+'</span><span class="ch '+chCls+'">'+ch+'</span></span>'+
        '<span class="dv">'+fmt(x.dollar_vol)+'</span></div>';
    }).join('');
  }
  function load(){
    fetch('./us-volume.json?t='+Math.floor(Date.now()/300000))
      .then(function(r){ if(!r.ok)throw new Error('資料檔 '+r.status); return r.json(); })
      .then(function(d){ DATA=d; $('status').style.display='none'; render(); })
      .catch(function(e){ $('status').textContent='載入失敗（'+e.message+'），稍後重試。'; });
  }
  $('tf').querySelectorAll('button').forEach(function(b){ b.addEventListener('click',function(){
    $('tf').querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); W=b.dataset.w; render();
  });});
  load();
})();
</script>
</body>
</html>
