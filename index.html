<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>英文單字卡</title>
<style>
  :root{
    --navy:#2C4D7A; --cream:#F5F1E8; --line:#e3ddcf; --ink:#22303f; --muted:#6b7785;
    --other:#e8833a; --self:#3a6ea5; --both:#8a8a8a;
    --x:#c62828; --warn:#b8860b; --ok:#2e7d32; --star:#7b5cd6;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Microsoft JhengHei','PingFang TC',sans-serif;background:var(--cream);color:var(--ink);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;}
  .app{width:100%;max-width:520px}

  /* 登入畫面 */
  .gate{text-align:center}
  .gate h1{color:var(--navy);font-size:26px;margin-bottom:6px}
  .gate p{color:var(--muted);font-size:14px;margin-bottom:22px}
  .gate input{width:100%;padding:14px 16px;font-size:17px;border:1px solid var(--line);border-radius:12px;text-align:center;margin-bottom:12px}
  .gate button{width:100%;padding:14px;font-size:17px;font-weight:700;color:#fff;background:var(--navy);border:none;border-radius:12px;cursor:pointer}
  .err{color:var(--x);font-size:13px;margin-top:10px;min-height:18px}

  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px;color:var(--muted)}
  .top .logout{cursor:pointer;text-decoration:underline}
  .top .del{cursor:pointer;color:var(--x);margin-right:16px}
  .srcrow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:12px}
  .srcrow select{flex:1;padding:9px 11px;font-size:15px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}
  .bar{height:6px;background:#e3ddcf;border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;background:var(--navy);width:0;transition:width .3s}

  .card{position:relative;width:100%;cursor:pointer;perspective:1400px;}
  .inner{position:relative;width:100%;min-height:380px;transition:transform .5s;transform-style:preserve-3d;}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:18px;
    box-shadow:0 8px 24px rgba(44,77,122,.12);padding:30px 26px;display:flex;flex-direction:column;justify-content:center;}
  .back{transform:rotateY(180deg)}
  .badge{position:absolute;top:16px;right:16px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;color:#fff;}
  .role-other{background:var(--other)} .role-self{background:var(--self)} .role-both{background:var(--both)}
  .src{position:absolute;top:16px;left:16px;font-size:11px;color:var(--muted)}
  .zh{font-size:25px;font-weight:700;line-height:1.55}
  .hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:13px;color:var(--muted)}
  .en{font-size:20px;font-style:normal;color:var(--navy);line-height:1.55;background:#F5F1E8;border-radius:10px;padding:14px 16px;margin-bottom:10px}
  .spk{background:none;border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--navy);font-size:13px;padding:3px 9px;flex:none;line-height:1.4}
  .spk:active{background:#eee}
  .spk-sentence{display:inline-flex;align-items:center;gap:5px;margin-bottom:14px}
  .zh-back{font-size:15px;color:var(--muted);line-height:1.55;margin-bottom:14px;padding:0 2px}
  .vocab{list-style:none}
  .vocab li{font-size:15px;padding:5px 0;border-bottom:1px dashed var(--line);display:flex;align-items:center;gap:8px}
  .vocab li .vtxt{flex:1}
  .vocab li::before{content:"・";color:var(--navy);font-weight:700;flex:none}

  .rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
  .rate button{border:none;border-radius:12px;padding:12px 4px;color:#fff;font-weight:700;font-size:14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center;}
  .rate small{font-weight:400;opacity:.85;font-size:11px}
  .b-x{background:var(--x)} .b-warn{background:var(--warn)} .b-ok{background:var(--ok)} .b-star{background:var(--star)}
  .rate.hidden{visibility:hidden}
  .center{text-align:center;color:var(--muted);padding:40px 10px}
  .center h2{color:var(--navy);margin-bottom:10px}
  .reset{margin-top:18px;background:none;border:1px solid var(--line);color:var(--muted);padding:8px 16px;border-radius:99px;font-size:13px;cursor:pointer}
  .sync{font-size:11px;color:var(--ok)}
  .home{text-align:center;padding:8px 0}
  .home-title{color:var(--navy);font-size:26px;margin-bottom:24px}
  .home-btn{display:block;width:100%;padding:22px 20px;margin-bottom:14px;border:1px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;font-size:20px;font-weight:700;color:var(--navy);box-shadow:0 6px 18px rgba(44,77,122,.08);text-align:left;line-height:1.3}
  .home-btn small{display:block;margin-top:7px;font-size:13px;font-weight:400;color:var(--muted)}
  .home-btn.alt{color:var(--self)}
  .home-foot{margin-top:20px}
  .top .back{cursor:pointer;text-decoration:underline;color:var(--navy)}
  .ovcount{font-size:13px;color:var(--muted);margin-bottom:6px}
  .ovlist{display:flex;flex-direction:column;gap:14px}
  .ovcard{position:relative;background:#fff;border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:14px;padding:18px;box-shadow:0 4px 14px rgba(44,77,122,.07)}
  .ov-zh{font-size:18px;font-weight:700;line-height:1.5;margin-bottom:9px;padding-right:52px}
  .ov-en{font-size:16px;color:var(--navy);background:#F5F1E8;border-radius:8px;padding:10px 12px;margin-bottom:9px;display:flex;align-items:center;gap:10px;justify-content:space-between}
  .ov-en>span{flex:1}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const SUPA_URL = "https://uxxystijyqtxicrpggff.supabase.co";
const SUPA_KEY = "sb_publishable_8vZn7IpyhAY27Y3s-jy9oQ_GneRz0jd";
const H = {apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY};
const HJ = {...H, "Content-Type":"application/json"};

async function fetchJSON(url, opts, tries=4){
  for(let t=0;t<tries;t++){
    try{ const r=await fetch(url,opts); if(r.ok) return await r.json(); }catch(e){}
    await new Promise(res=>setTimeout(res, 500*(t+1)));
  }
  throw new Error("network");
}
let passcode = localStorage.getItem("fc_passcode") || "";
let cards=[], prog={}, deck=[], i=0, flipped=false, selectedSource="ALL";
const el = id => document.getElementById(id);
const todayStr = () => new Date().toISOString().slice(0,10);
const roleName = {other:"對方",self:"我",both:"兩人"};

function gateScreen(msg){
  el("app").innerHTML =
    '<div class="gate"><h1>📖 英文單字卡</h1><p>輸入你的 passcode（手機、電腦用同一組就會同步）</p>'+
    '<input id="pc" type="text" placeholder="例如 ken2026" autocomplete="off" value="'+passcode+'">'+
    '<button onclick="login()">開始複習</button><div class="err" id="err">'+(msg||'')+'</div></div>';
  el("pc").addEventListener("keydown",e=>{if(e.key==="Enter")login();});
}
async function login(){
  const input = el("pc");
  const code = (input ? input.value : passcode).trim();   // 自動登入時沒有輸入框，改用已存的 passcode
  if(!code){ if(input) el("err").textContent="請輸入 passcode"; else gateScreen("請輸入 passcode"); return; }
  passcode = code; localStorage.setItem("fc_passcode", code);
  el("app").innerHTML='<div class="center"><h2>載入中…</h2><p>從雲端讀取你的卡與進度</p></div>';
  try{
    cards = await fetchJSON(SUPA_URL+"/rest/v1/cards?select=*", {headers:H});
    const rows = await fetchJSON(SUPA_URL+"/rest/v1/progress?select=*&passcode=eq."+encodeURIComponent(code), {headers:H});
    prog={}; rows.forEach(r=> prog[r.card_id]={errorCount:r.error_count, nextReview:r.next_review});
    homeScreen();
  }catch(e){ gateScreen("連線失敗，請再試一次"); }
}
function logout(){ localStorage.removeItem("fc_passcode"); passcode=""; gateScreen(); }

function appearProb(e){ return e>=3?0.6 : e>=2?0.4 : e>=1?0.2 : 0.1; }
function buildDeck(){
  const t = todayStr();
  const pool = (selectedSource==="ALL") ? cards : cards.filter(c=>c.source===selectedSource); // 範圍只是過濾，記憶/遺忘曲線全域共用，不分週
  const due = pool.filter(c=>{
    const p = prog[c.id];
    if(!p || !p.nextReview) return true;            // 從未複習 → 必出現
    if(p.nextReview > t) return false;               // 還沒到複習日 → 跳過（遺忘曲線）
    return Math.random() < appearProb(p.errorCount||0); // 到期 → 依答錯機率出現
  });
  for(let k=due.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[due[k],due[j]]=[due[j],due[k]];}
  return due;
}
function srcLabel(s){
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:_to_\d{4}-(\d{2})-(\d{2}))?$/);
  if(!m) return s;
  const a=(+m[2])+"/"+(+m[3]);
  return m[4] ? a+"–"+((+m[4])+"/"+(+m[5])) : a;
}
function fillSources(){
  const sel=el("srcSel"); if(!sel) return;
  const srcs=[...new Set(cards.map(c=>c.source))].sort();
  sel.innerHTML='<option value="ALL">全部</option>'+
    srcs.map(s=>'<option value="'+s+'">'+srcLabel(s)+'（'+cards.filter(c=>c.source===s).length+' 張）</option>').join("");
  sel.value=selectedSource;
}
function onSrcChange(){
  selectedSource=el("srcSel").value;
  deck=buildDeck(); i=0; reviewScreen();
}
function homeScreen(){
  el("app").innerHTML=
    '<div class="home"><h1 class="home-title">📖 英文單字卡</h1>'+
      '<button class="home-btn" onclick="startReview()">🃏 單字卡複習<small>翻卡 + 遺忘曲線，幫你記住</small></button>'+
      '<button class="home-btn alt" onclick="overviewScreen()">📋 單字卡總攬<small>選範圍，直接看全部答案</small></button>'+
      '<div class="home-foot"><span class="logout" onclick="logout()">換 passcode</span></div></div>';
}
function startReview(){ deck=buildDeck(); i=0; reviewScreen(); }
function overviewScreen(){
  el("app").innerHTML=
    '<div class="top"><span class="back" onclick="homeScreen()">← 返回</span><span class="logout" onclick="logout()">換 passcode</span></div>'+
    '<div class="srcrow">範圍：<select id="srcSel" onchange="onOvChange()"></select></div>'+
    '<div id="ovlist" class="ovlist"></div>';
  fillSources(); renderOverview();
}
function onOvChange(){ selectedSource=el("srcSel").value; renderOverview(); }
function renderOverview(){
  const pool=(selectedSource==="ALL")?cards:cards.filter(c=>c.source===selectedSource);
  const box=el("ovlist");
  if(!pool.length){ box.innerHTML='<div class="center"><p>這個範圍沒有卡片</p></div>'; return; }
  box.innerHTML='<div class="ovcount">'+pool.length+' 張</div>'+pool.map((c,k)=>
    '<div class="ovcard"><span class="badge role-'+c.role+'">'+roleName[c.role]+'</span>'+
      '<div class="ov-zh">'+c.zh+'</div>'+
      '<div class="ov-en"><span>'+c.en+'</span><button class="spk" data-ov="'+k+'">🔊</button></div>'+
      '<ul class="vocab">'+(c.vocab||[]).map((v,vk)=>'<li><span class="vtxt">'+v+'</span><button class="spk" data-ov="'+k+'" data-vk="'+vk+'">🔊</button></li>').join('')+'</ul></div>'
  ).join('');
  box.querySelectorAll("button[data-ov]").forEach(b=>{ b.onclick=()=>{ const c=pool[+b.dataset.ov]; if(b.dataset.vk!==undefined) speak((c.vocab[+b.dataset.vk]||"").split(/／|\//)[0].trim()); else speak(c.en); }; });
}

function reviewScreen(){
  if(i>=deck.length){ return finishScreen(); }
  el("app").innerHTML =
    '<div class="top"><span><span class="back" onclick="homeScreen()">← 返回</span> <span id="counter"></span></span><span><span class="del" onclick="delCard(event)">🗑 刪除</span><span class="logout" onclick="logout()">換 passcode</span></span></div>'+
    '<div class="srcrow">範圍：<select id="srcSel" onchange="onSrcChange()"></select></div>'+
    '<div class="bar"><i id="prog"></i></div>'+
    '<div id="card" class="card" onclick="flip()"><div class="inner">'+
      '<div class="face front"><span id="s1" class="src"></span><span id="b1" class="badge"></span>'+
        '<div class="zh" id="zh"></div><div class="hint">👆 點一下看答案</div></div>'+
      '<div class="face back"><span id="b2" class="badge"></span><div class="en" id="en"></div>'+
        '<button class="spk spk-sentence" id="enSpk">🔊 念整句</button>'+
        '<div class="zh-back" id="zhBack"></div>'+
        '<ul class="vocab" id="vocab"></ul></div>'+
    '</div></div>'+
    '<div id="rate" class="rate hidden">'+
      '<button class="b-x" onclick="rate(event,\'x\')">❌<small>不會 +1天</small></button>'+
      '<button class="b-warn" onclick="rate(event,\'w\')">⚠️<small>印象 +3天</small></button>'+
      '<button class="b-ok" onclick="rate(event,\'o\')">✓<small>記得 +7天</small></button>'+
      '<button class="b-star" onclick="rate(event,\'s\')">⭐<small>很熟 +14天</small></button>'+
    '</div>';
  fillSources(); render();
}
function render(){
  const c = deck[i]; flipped=false;
  el("counter").textContent=(i+1)+" / "+deck.length;
  el("prog").style.width=(i/deck.length*100)+"%";
  el("zh").textContent=c.zh; el("en").textContent=c.en; el("s1").textContent=c.source;
  el("zhBack").textContent=c.zh;
  el("vocab").innerHTML=(c.vocab||[]).map((v,k)=>'<li><span class="vtxt">'+v+'</span><button class="spk" data-vk="'+k+'">🔊</button></li>').join("");
  el("enSpk").onclick=e=>{ e.stopPropagation(); speak(c.en); };
  el("vocab").querySelectorAll("button[data-vk]").forEach(b=>{ b.onclick=e=>{ e.stopPropagation(); speak((c.vocab[+b.dataset.vk]||"").split(/／|\//)[0].trim()); }; });
  for(const b of [el("b1"),el("b2")]){ b.className="badge role-"+c.role; b.textContent=roleName[c.role]; }
  el("card").classList.remove("flipped"); el("rate").classList.add("hidden");
  requestAnimationFrame(fitCard); setTimeout(fitCard,80); setTimeout(fitCard,300);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitCard); // 字體載入後字會變高，要重量
}
function fitCard(){
  const card=el("card"); if(!card) return;
  const inner=card.querySelector(".inner");
  let h=380;
  card.querySelectorAll(".face").forEach(f=>{
    const prev=f.style.justifyContent; f.style.justifyContent="flex-start"; // 量真實內容高，避開置中造成的溢出誤差
    h=Math.max(h, f.scrollHeight);
    f.style.justifyContent=prev;
  });
  card.style.height=h+"px"; inner.style.height=h+"px";
}
function flip(){
  flipped=!flipped;
  el("card").classList.toggle("flipped",flipped);
  el("rate").classList.toggle("hidden",!flipped);
}
function bestVoice(){
  const all=speechSynthesis.getVoices();
  const enUS=all.filter(v=>/^en[-_]US/i.test(v.lang));
  const pool=enUS.length?enUS:all.filter(v=>/^en/i.test(v.lang));
  const prefer=["Natural","Google US English","Samantha","Aria","Jenny","Google"]; // 挑較自然的
  for(const p of prefer){ const m=pool.find(v=>v.name.includes(p)); if(m) return m; }
  return pool[0]||null;
}
function speak(text){
  if(!text) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-US"; u.rate=.75; u.pitch=1;   // 慢約 20%、自然語調
    const v=bestVoice(); if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
async function delCard(e){
  e.stopPropagation();
  const c=deck[i];
  if(!confirm("確定刪除這張卡？刪了無法復原。\n\n"+c.zh+"\n"+c.en)) return;
  try{
    const r=await fetch(SUPA_URL+"/rest/v1/cards?id=eq."+encodeURIComponent(c.id),{method:"DELETE",headers:H});
    if(!r.ok) throw 0;
    cards=cards.filter(x=>x.id!==c.id);
    deck.splice(i,1);
    reviewScreen();
  }catch(err){ alert("刪除失敗，請再試一次"); }
}
function rate(e,grade){
  e.stopPropagation();
  const add={x:1,w:3,o:7,s:14}[grade], errAdd={x:1.0,w:0.5,o:0,s:0}[grade];
  const c=deck[i], p=prog[c.id]||{errorCount:0};
  p.errorCount=(p.errorCount||0)+errAdd;
  const d=new Date(); d.setDate(d.getDate()+add); p.nextReview=d.toISOString().slice(0,10);
  prog[c.id]=p;
  // 同步到雲端（不擋畫面）
  fetch(SUPA_URL+"/rest/v1/progress?on_conflict=passcode,card_id",{
    method:"POST", headers:{...HJ, Prefer:"resolution=merge-duplicates"},
    body:JSON.stringify({passcode, card_id:c.id, error_count:p.errorCount, next_review:p.nextReview, updated_at:new Date().toISOString()})
  }).catch(()=>{});
  i++; reviewScreen();
}
function finishScreen(){
  const msg = deck.length===0 ? (selectedSource==="ALL"?"今天沒有到期的卡 🎉":"這個範圍今天沒到期的卡 🎉") : "🎉 複習完了";
  el("app").innerHTML='<div class="center"><h2>'+msg+'</h2>'+
    '<p>換個範圍繼續：</p>'+
    '<div class="srcrow" style="justify-content:center">範圍：<select id="srcSel" onchange="onSrcChange()"></select></div>'+
    '<button class="reset" onclick="homeScreen()">← 回首頁</button> '+
    '<button class="reset" onclick="login()">重新整理</button> '+
    '<button class="reset" onclick="logout()">換 passcode</button></div>';
  fillSources();
}

if(passcode) login(); else gateScreen();
</script>
</body>
</html>
