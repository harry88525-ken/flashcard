<title>英文單字卡</title>
<style>
  :root{
    --navy:#2C4D7A; --cream:#F5F1E8; --line:#e3ddcf; --ink:#22303f; --muted:#6b7785;
    --other:#e8833a; --self:#3a6ea5; --both:#8a8a8a;
    --x:#c62828; --warn:#b8860b; --ok:#2e7d32; --star:#7b5cd6;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Microsoft JhengHei','PingFang TC',sans-serif;background:var(--cream);color:var(--ink);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;}
  .app{width:100%;max-width:520px}

  /* 登入畫面 */
  .gate{text-align:center}
  .gate h1{color:var(--navy);font-size:26px;margin-bottom:6px}
  .gate p{color:var(--muted);font-size:14px;margin-bottom:22px}
  .gate input{width:100%;padding:14px 16px;font-size:17px;border:1px solid var(--line);border-radius:12px;text-align:center;margin-bottom:12px}

<!-- FSRS 排程引擎（ts-fsrs，權威實作；掛 window.FSRS 供下方非-module script 呼叫）-->
<script type="module">
  import { createEmptyCard, fsrs, generatorParameters, Rating } from 'https://esm.sh/ts-fsrs@4';
  const f = fsrs(generatorParameters({ request_retention: 0.9, enable_fuzz: true, maximum_interval: 36500 }));
  const RMAP = { x: Rating.Again, w: Rating.Hard, o: Rating.Good, s: Rating.Easy };
  function rebuild(p){
    const now = new Date();
    if (p && p.stability != null) {
      return {
        due: p.nextReview ? new Date(p.nextReview) : now,
        stability: p.stability, difficulty: p.difficulty,
        elapsed_days: 0, scheduled_days: 0,
        reps: p.reps || 0, lapses: p.lapses || 0, state: p.state || 0,
        last_review: p.last_review ? new Date(p.last_review) : undefined,
      };
    }
    return createEmptyCard(now); // 沒有 FSRS 狀態（舊卡/新卡）→ 當新卡初始化
  }
  function fmt(due, now){
    const d = Math.round((due - now) / 86400000);
    return d <= 0 ? "<1天" : d < 30 ? d + "天" : d < 365 ? Math.round(d/30) + "個月" : (d/365).toFixed(1) + "年";
  }
  window.FSRS = {
    ready: true,
    schedule(p, gradeChar){
      const now = new Date();
      const c = f.repeat(rebuild(p), now)[RMAP[gradeChar]].card;
      return {
        stability: c.stability, difficulty: c.difficulty, state: c.state,
        reps: c.reps, lapses: c.lapses,
        last_review: now.toISOString(),
        next_review: c.due.toISOString().slice(0,10),
      };
    },
    preview(p){
      const now = new Date();
      const rec = f.repeat(rebuild(p), now);
      return {
        x: fmt(rec[Rating.Again].card.due, now), w: fmt(rec[Rating.Hard].card.due, now),
        o: fmt(rec[Rating.Good].card.due, now),  s: fmt(rec[Rating.Easy].card.due, now),
      };
    }
  };
</script>

<script>
const SUPA_URL = "https://uxxystijyqtxicrpggff.supabase.co";
const SUPA_KEY = "sb_publishable_8vZn7IpyhAY27Y3s-jy9oQ_GneRz0jd";
const H = {apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY};
const HJ = {...H, "Content-Type":"application/json"};

async function fetchJSON(url, opts, tries=4){
  for(let t=0;t<tries;t++){
    try{ const r=await fetch(url,opts); if(r.ok) return await r.json(); }catch(e){}
    await new Promise(res=>setTimeout(res, 500*(t+1)));
  }
  throw new Error("network");
}
let passcode = localStorage.getItem("fc_passcode") || "";
let cards=[], prog={}, deck=[], i=0, flipped=false, selectedSources=new Set(); // 空集合=全部；可複選多週
let history=[];   // 評分前狀態堆疊，供「↩ 上一張」還原（含覆寫回雲端，根治按錯評分）
const el = id => document.getElementById(id);
const todayStr = () => new Date().toISOString().slice(0,10);
const roleName = {other:"對方",self:"我",both:"兩人"};

function gateScreen(msg){
  el("app").innerHTML =
    '<div class="gate"><h1>📖 英文單字卡</h1><p>輸入你的 passcode（手機、電腦用同一組就會同步）</p>'+
    '<input id="pc" type="text" placeholder="例如 ken2026" autocomplete="off" value="'+passcode+'">'+
    '<button onclick="login()">開始複習</button><div class="err" id="err">'+(msg||'')+'</div></div>';
  el("pc").addEventListener("keydown",e=>{if(e.key==="Enter")login();});
}
async function login(){
  const input = el("pc");
  const code = (input ? input.value : passcode).trim();   // 自動登入時沒有輸入框，改用已存的 passcode
  if(!code){ if(input) el("err").textContent="請輸入 passcode"; else gateScreen("請輸入 passcode"); return; }
  passcode = code; localStorage.setItem("fc_passcode", code);
  el("app").innerHTML='<div class="center"><h2>載入中…</h2><p>從雲端讀取你的卡與進度</p></div>';
  try{
    cards = await fetchJSON(SUPA_URL+"/rest/v1/cards?select=*", {headers:H});
    const rows = await fetchJSON(SUPA_URL+"/rest/v1/progress?select=*&passcode=eq."+encodeURIComponent(code), {headers:H});
    prog={}; rows.forEach(r=> prog[r.card_id]={errorCount:r.error_count, nextReview:r.next_review, stability:r.stability, difficulty:r.difficulty, state:r.state, reps:r.reps, lapses:r.lapses, last_review:r.last_review});
    homeScreen();
  }catch(e){ gateScreen("連線失敗，請再試一次"); }
}
function logout(){ localStorage.removeItem("fc_passcode"); passcode=""; gateScreen(); }

function appearProb(e){ return e>=3?0.6 : e>=2?0.4 : e>=1?0.2 : 0.1; }
function buildDeck(){
  const t = todayStr();
  const pool = selectedSources.size===0 ? cards : cards.filter(c=>selectedSources.has(c.source)); // 範圍只是過濾，記憶/遺忘曲線全域共用，不分週
  const due = pool.filter(c=>{
    const p = prog[c.id];
    if(!p || !p.nextReview) return true;            // 從未複習 → 必出現
    return p.nextReview <= t;                         // 到期才出（FSRS 已精確排程，不再用隨機機率）
  });
  for(let k=due.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[due[k],due[j]]=[due[j],due[k]];}
  return due;
}
function srcLabel(s){
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:_to_\d{4}-(\d{2})-(\d{2}))?$/);
  if(!m) return s;
  const a=(+m[2])+"/"+(+m[3]);
  return m[4] ? a+"–"+((+m[4])+"/"+(+m[5])) : a;
}
function fillChips(onChange){
  const box=el("srcChips"); if(!box) return;
  const srcs=[...new Set(cards.map(c=>c.source))].sort();
  box.innerHTML='<button class="chip'+(selectedSources.size===0?' on':'')+'" data-src="ALL">全部</button>'+
    srcs.map(s=>'<button class="chip'+(selectedSources.has(s)?' on':'')+'" data-src="'+s+'">'+srcLabel(s)+'<small>'+cards.filter(c=>c.source===s).length+'</small></button>').join('');
  box.querySelectorAll('button[data-src]').forEach(b=>{
    b.onclick=()=>{
      const src=b.dataset.src;
      if(src==="ALL") selectedSources.clear();
      else selectedSources.has(src)?selectedSources.delete(src):selectedSources.add(src);
      fillChips(onChange); // 重畫 chips 更新高亮
      onChange();
    };
  });
}
function homeScreen(){
  el("app").innerHTML=
    '<div class="home"><h1 class="home-title">📖 英文單字卡</h1>'+
      '<button class="home-btn" onclick="startReview()">🃏 單字卡複習<small>翻卡 + 遺忘曲線，幫你記住</small></button>'+
      '<button class="home-btn alt" onclick="overviewScreen()">📋 單字卡總攬<small>選範圍，直接看全部答案</small></button>'+'<button class="home-btn" style="color:var(--star)" onclick="PD.open()">🎯 Pattern Drill 口說<small>出國 10 主題，聽提示開口講</small></button>'+
      '<button class="home-btn" style="color:var(--star)" onclick="PD.reviewHome()">📖 Pattern Drill 複習<small>整組中英對照，用看的滑著複習</small></button>'+
      '<button class="home-btn" style="color:var(--self)" onclick="location.href=\'grammar.html\'">📚 文法學堂<small>主題式文法＋介系詞，像參考書一樣翻</small></button>'+
      '<div class="home-foot"><span class="logout" onclick="logout()">換 passcode</span></div></div>';
}
function startReview(){ deck=buildDeck(); i=0; history=[]; reviewScreen(); }
function overviewScreen(){
  el("app").innerHTML=
    '<div class="top"><span class="back" onclick="homeScreen()">← 返回</span><span class="logout" onclick="logout()">換 passcode</span></div>'+
    '<div class="srcrow">範圍：<div class="chips" id="srcChips"></div></div>'+
    '<div id="ovlist" class="ovlist"></div>';
  fillChips(()=>renderOverview()); renderOverview();
}
function renderOverview(){
  const pool=selectedSources.size===0?cards:cards.filter(c=>selectedSources.has(c.source));
  const box=el("ovlist");

function render(){

  for(const b of [el("b1"),el("b2")]){ b.className="badge role-"+c.role; b.textContent=roleName[c.role]; }

  requestAnimationFrame(fitCard); setTimeout(fitCard,80); setTimeout(fitCard,300);

    const pv=window.FSRS.preview(prog[c.id]);

function fitCard(){
  const card=el("card"); if(!card) return;
  const inner=card.querySelector(".inner");
  let h=380;
  card.querySelectorAll(".face").forEach(f=>{
    const prev=f.style.justifyContent; f.style.justifyContent="flex-start"; // 量真實內容高，避開置中造成的溢出誤差
    h=Math.max(h, f.scrollHeight);
    f.style.justifyContent=prev;
  });
  card.style.height=h+"px"; inner.style.height=h+"px";
}
function flip(){
  flipped=!flipped;
  el("card").classList.toggle("flipped",flipped);
  el("rate").classList.toggle("hidden",!flipped);
}
function bestVoice(){
  const all=speechSynthesis.getVoices();
  const enUS=all.filter(v=>/^en[-_]US/i.test(v.lang));
  const pool=enUS.length?enUS:all.filter(v=>/^en/i.test(v.lang));
  const prefer=["Natural","Google US English","Samantha","Aria","Jenny","Google"]; // 挑較自然的
  for(const p of prefer){ const m=pool.find(v=>v.name.includes(p)); if(m) return m; }
  return pool[0]||null;
}
function speak(text){
  if(!text) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-US"; u.rate=.75; u.pitch=1;   // 慢約 20%、自然語調
    const v=bestVoice(); if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
async function delCard(e){
  e.stopPropagation();
  const c=deck[i];
  if(!confirm("確定刪除這張卡？刪了無法復原。\n\n"+c.zh+"\n"+c.en)) return;
  try{
    const r=await fetch(SUPA_URL+"/rest/v1/cards?id=eq."+encodeURIComponent(c.id),{method:"DELETE",headers:H});
    if(!r.ok) throw 0;
    cards=cards.filter(x=>x.id!==c.id);
    deck.splice(i,1);
    history=[];          // 刪卡後 deck 索引位移，清掉還原堆疊避免錯亂
    reviewScreen();
  }catch(err){ alert("刪除失敗，請再試一次"); }
}
function rate(e,grade){
  e.stopPropagation();
  const c=deck[i];
  history.push({index:i, cardId:c.id, before: prog[c.id]?{...prog[c.id]}:null});  // 記住評分前進度，供「↩ 上一張」還原
  let p=prog[c.id]||{};
  let body;
  if(window.FSRS && window.FSRS.ready){
    const r=window.FSRS.schedule(p, grade);   // FSRS：依記憶穩定度/難度動態算下次複習日
    p={...p, stability:r.stability, difficulty:r.difficulty, state:r.state, reps:r.reps, lapses:r.lapses, last_review:r.last_review, nextReview:r.next_review};
    body={passcode, card_id:c.id, stability:r.stability, difficulty:r.difficulty, state:r.state, reps:r.reps, lapses:r.lapses, last_review:r.last_review, next_review:r.next_review, updated_at:new Date().toISOString()};
  } else {
    const add={x:1,w:3,o:7,s:14}[grade], errAdd={x:1.0,w:0.5,o:0,s:0}[grade];   // fallback：FSRS 未載入時用舊固定間隔
    p.errorCount=(p.errorCount||0)+errAdd;
    const d=new Date(); d.setDate(d.getDate()+add); p.nextReview=d.toISOString().slice(0,10);
    body={passcode, card_id:c.id, error_count:p.errorCount, next_review:p.nextReview, updated_at:new Date().toISOString()};
  }
  prog[c.id]=p;
  saveProgToCloud(body);   // 同步到雲端（不擋畫面）
  i++; reviewScreen();
}
function progBody(cardId,p){   // 進度物件 → Supabase 寫入 body（FSRS 版 / 舊固定間隔版都支援）
  const base={passcode, card_id:cardId, updated_at:new Date().toISOString()};
  return p.stability!=null
    ? {...base, stability:p.stability, difficulty:p.difficulty, state:p.state, reps:p.reps, lapses:p.lapses, last_review:p.last_review, next_review:p.nextReview}
    : {...base, error_count:p.errorCount, next_review:p.nextReview};
}
function saveProgToCloud(body){
  fetch(SUPA_URL+"/rest/v1/progress?on_conflict=passcode,card_id",{
    method:"POST", headers:{...HJ, Prefer:"resolution=merge-duplicates"}, body:JSON.stringify(body)
  }).catch(()=>{});
}
function deleteProgFromCloud(cardId){   // 還原成「從未複習」→ 刪掉雲端進度列
  fetch(SUPA_URL+"/rest/v1/progress?passcode=eq."+encodeURIComponent(passcode)+"&card_id=eq."+encodeURIComponent(cardId),
    {method:"DELETE", headers:H}).catch(()=>{});
}
function undoRate(e){   // ↩ 上一張：退回上一張卡，把它評分前的進度（含雲端）原封還原
  if(e) e.stopPropagation();
  if(!history.length) return;
  const h=history.pop();
  if(h.before){ prog[h.cardId]=h.before; saveProgToCloud(progBody(h.cardId,h.before)); }
  else { delete prog[h.cardId]; deleteProgFromCloud(h.cardId); }
  i=h.index; reviewScreen();
}
function finishScreen(){
  const msg = deck.length===0 ? (selectedSources.size===0?"今天沒有到期的卡 🎉":"這個範圍今天沒到期的卡 🎉") : "🎉 複習完了";

}

const RATE={slow:0.7,mid:0.85,fast:1.0};   // 教練念的速度
const curSpeed=()=>localStorage.getItem("pd_speed")||"slow";
const getRate=()=>RATE[curSpeed()];
function setSpeed(s){localStorage.setItem("pd_speed",s);home();}
const CD=3;   // 倒數秒數（固定 3 秒）
const el=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
const norm=s=>(s||"").toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
const prog=JSON.parse(localStorage.getItem("pd_prog")||"{}");  // {themeId:{next,score}}
function saveProg(){ localStorage.setItem("pd_prog",JSON.stringify(prog)); }

let theme=null, flat=[], idx=0, weak=[], heardText="", timer=null, recog=null, recording=false, cdStarted=false;
let pdHistory=[];   // {idx,weakLen} 堆疊，供「↩ 上一題」退回（並還原誤判時加進的弱句）

// ---- 把一個主題攤平成 63 題 ----
function buildFlat(t){
  const f=[];
  t.echo.forEach((e,k)=>f.push({seg:"暖身",type:"echo",n:k+1,total:t.echo.length,speak:e.en,expected:e.en,zh:e.zh}));
  const sb=t.sub;
  sb.cues.forEach((c,k)=>f.push({seg:"替換",type:"sub",n:k+1,total:sb.cues.length,speak:c.w,
    base:sb.base,expected:sb.base.replace(sb.slot,c.w),zh:sb.baseZh.replace(sb.slotZh,c.zh),announce:(k===0?sb.base:null)}));
  t.trans.forEach((it,k)=>f.push({seg:"轉換",type:"trans",n:k+1,total:t.trans.length,speak:it.base,
    base:it.base,instr:it.instr,expected:it.expected,zh:it.zh}));
  t.resp.forEach((it,k)=>f.push({seg:"回應",type:"resp",n:k+1,total:t.resp.length,speak:null,
    show:it.zh,expected:it.expected,zh:it.zh}));
  let en=0; const etot=t.exp.reduce((s,c)=>s+c.adds.length,0);
  t.exp.forEach(chain=>{ let prev=chain.base;
    chain.adds.forEach((a,ai)=>{ en++; f.push({seg:"擴展",type:"exp",n:en,total:etot,speak:a.cue,
      prev:prev,expected:a.full,zh:a.zh,announce:(ai===0?chain.base:null),chainZh:(ai===0?chain.baseZh:null)}); prev=a.full; });
  });
  return f;
}

// ---- 語音 ----
function bestVoice(){const all=speechSynthesis.getVoices();const en=all.filter(v=>/^en[-_]US/i.test(v.lang));const pool=en.length?en:all.filter(v=>/^en/i.test(v.lang));for(const p of["Natural","Google US English","Samantha","Aria","Jenny","Google"]){const m=pool.find(v=>v.name.includes(p));if(m)return m;}return pool[0]||null;}
function say(text,rate,cb){try{const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=rate||.95;const v=bestVoice();if(v)u.voice=v;if(cb)u.onend=cb;speechSynthesis.speak(u);}catch(e){if(cb)setTimeout(cb,300);}}
function fallbackCD(cb,ms){setTimeout(cb,ms);}

function start(k){ theme=THEMES[k]; flat=buildFlat(theme); idx=0; weak=[]; pdHistory=[]; drill(); }

// ---- 看的複習：選主題 ----
function reviewHome(){

// ---- 看的複習：列出某主題全部句子（依段落分組） ----
function reviewTheme(k){
  const t=THEMES[k], list=buildFlat(t), order=["暖身","替換","轉換","回應","擴展"];
  const groups={}; list.forEach(q=>{ (groups[q.seg]=groups[q.seg]||[]).push(q); });
  const rows=[]; let body='<div class="pdrev">';
  order.forEach(seg=>{ const arr=groups[seg]; if(!arr) return;
    body+='<div class="grp">'+seg+'（'+arr.length+'）</div>';
    arr.forEach(q=>{ const en=q.expected||q.speak||""; const r=rows.push(en)-1;
      body+='<div class="pdrev-card"><div class="pdrev-zh">'+(q.zh||q.show||"")+'</div>'+
        '<div class="pdrev-en"><span>'+en+'</span><button class="spk" data-rev="'+r+'">🔊</button></div></div>'; });
  });
  body+='</div>';
  el("app").innerHTML=
    '<div class="pdtop"><span class="back" onclick="PD.reviewHome()">← 看的複習</span>'+
      '<span class="stage">'+t.emoji+' '+t.label+'</span></div>'+
    '<p class="sub">'+list.length+' 句 · 點 🔊 聽發音</p>'+body;
  el("app").querySelectorAll("button[data-rev]").forEach(b=>{ b.onclick=()=>say(rows[+b.dataset.rev],getRate()); });
}

// ---- 每一題 ----
function drill(){
  if(idx>=flat.length) return themeDone();
  const q=flat[idx]; heardText="";
  let body='';
  if(q.type==="echo")
    body='<div class="cuelab">跟我念一次（暖身）</div><div class="cue sent">'+q.expected+'</div><div class="answerzh">'+q.zh+'</div>';
  else if(q.type==="sub")
    body='<div class="base">基礎句：<b>'+q.base+'</b></div><div class="cuelab">替換 → 講出整句</div><div class="cue">'+q.speak+'</div><div class="timer" id="timer"></div>';
  else if(q.type==="trans")
    body='<div class="cue sent">'+q.base+'</div><div class="cuelab">指令：<b>'+q.instr+'</b> → 講出來</div><div class="timer" id="timer"></div>';
  else if(q.type==="resp")
    body='<div class="cuelab">情境（用英文說出來）</div><div class="cue pdzh">'+q.show+'</div><div class="timer" id="timer"></div>';
  else if(q.type==="exp")
    body='<div class="base" style="font-size:18px;color:var(--ink)">'+q.prev+'</div><div class="cuelab">加上 → 講出整句</div><div class="cue">'+q.speak+'</div><div class="timer" id="timer"></div>';

  el("app").innerHTML=
    '<div class="pdtop"><span><span class="back" onclick="PD.open()">← 結束</span>'+(pdHistory.length?' <span class="back" onclick="PD.prevItem()">↩ 上一題</span>':'')+'</span>'+
      '<span class="stage">'+theme.emoji+' '+q.seg+' '+q.n+'/'+q.total+'</span></div>'+
    '<div class="pdbar"><i id="prog"></i></div>'+
    '<div class="seglab">主題：<b>'+theme.label+'</b></div>'+
    '<div class="panel" id="panel">'+body+'</div>'+
    (q.type==="echo"
      ? '<button class="mic" onclick="PD.nextItem()">✓ 念好了，下一個</button>'
      : '<button class="mic" id="mic" onclick="PD.toggleRec()">🎤 點一下開始講</button>'+
        '<div class="row"><button onclick="PD.replay()">🔊 再聽提示</button><button onclick="PD.showAnswer()">看正解／自評</button></div>'+
        '<div class="pdhint">講完它會比對；聽錯也沒關係，最後一票你按。</div>');
  el("prog").style.width=(idx/flat.length*100)+"%";

  // 唸提示 + 倒數（echo 只唸、不倒數）
  cdStarted=false;
  const startCD=()=>{ if(cdStarted)return; cdStarted=true; if(el("timer")) countdown(); };
  speechSynthesis.cancel();
  setTimeout(()=>{
    if(q.type==="echo"){ say(q.expected,getRate()); return; }
    if(q.type==="resp"){ startCD(); return; }            // 中文情境不唸，直接倒數
    if(q.announce){ say(q.announce,getRate(),()=>say(q.speak,getRate(),startCD)); fallbackCD(startCD,7000); }
    else { say(q.speak,getRate(),startCD); fallbackCD(startCD, q.type==="trans"?5000:3000); }
  },150);
}
function countdown(){let t=CD;const e=el("timer");if(!e)return;e.className="timer";e.textContent="⏱ "+t;clearInterval(timer);
  timer=setInterval(()=>{t--;if(t>0){e.textContent="⏱ "+t;}else{clearInterval(timer);e.className="timer out";e.textContent="⏱ time out！趕快講～";}},1000);}
function replay(){const q=flat[idx];if(!q)return;speechSynthesis.cancel();
  if(q.type==="sub"||q.type==="exp"){say(q.announce||q.base||q.prev,getRate(),()=>say(q.speak,getRate()));}
  else if(q.type==="trans")say(q.base,getRate());
  else if(q.type==="echo")say(q.expected,getRate());}
function nextItem(){ pdHistory.push({idx,weakLen:weak.length}); idx++; drill(); }
function prevItem(){   // ↩ 上一題：退回上一題，並移除這題誤判時加進的弱句
  if(!pdHistory.length) return;
  const h=pdHistory.pop();
  weak.length=h.weakLen;
  idx=h.idx; drill();
}

// ---- 語音辨識 ----
function toggleRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ showAnswer(); return; }
  if(recording){ try{recog.stop();}catch(e){} return; }
  try{
    recog=new SR(); recog.lang="en-US"; recog.interimResults=false; recog.maxAlternatives=1;
    recording=true; el("mic").classList.add("rec"); el("mic").textContent="🔴 聽你說…（再點停止）";
    recog.onresult=e=>{ heardText=e.results[0][0].transcript; };
    recog.onerror=()=>{};
    recog.onend=()=>{ recording=false; const m=el("mic"); if(m){m.classList.remove("rec");m.textContent="🎤 點一下開始講";} showAnswer(); };
    recog.start();
  }catch(e){ recording=false; showAnswer(); }
}
// ---- 比對 + 正解 + 自評 ----
function showAnswer(){
  clearInterval(timer);
  const q=flat[idx]; const exp=norm(q.expected), got=norm(heardText);
  let verdict, suggest;
  if(!heardText){ verdict='<span class="diff-bad">（沒聽到 / 你自評）</span>'; suggest="w"; }
  else if(got===exp){ verdict='<span class="diff-ok">✓ 跟正解一致</span>'; suggest="o"; }
  else { const d=wordDiff(got,exp); verdict='差異：'+d.html; suggest=d.close?"w":"x"; }
  el("panel").innerHTML=
    (heardText?'<div class="heard"><span class="lab">你說的：</span>'+heardText+'</div>':'<div class="heard"><span class="lab">（沒收到語音）</span></div>')+
    '<div class="answer">'+q.expected+'</div>'+(q.zh?'<div class="answerzh">'+q.zh+'</div>':'')+
    '<div class="verdict">'+verdict+'</div>';
  say(q.expected,getRate());
  document.querySelectorAll(".mic,.row,.pdhint").forEach(e=>e.remove());
  const g=document.createElement("div"); g.className="grade";
  g.innerHTML='<button class="b-x" onclick="PD.grade(\'x\')">❌<small>不會</small></button>'+
    '<button class="b-w" onclick="PD.grade(\'w\')">⚠️<small>差一點</small></button>'+
    '<button class="b-o" onclick="PD.grade(\'o\')">✓<small>講對了</small></button>'+
    '<button class="b-s" onclick="PD.grade(\'s\')">⭐<small>很順</small></button>';
  el("panel").after(g);
  const tip=document.createElement("div"); tip.className="pdhint";
  tip.innerHTML="建議："+({x:"❌不會",w:"⚠️差一點",o:"✓講對了",s:"⭐很順"}[suggest])+" — 但<b>你按了算</b>。";
  g.after(tip);
}
function wordDiff(got,exp){const g=got.split(" "),e=exp.split(" ");
  const html=e.map(w=>g.includes(w)?'<span class="diff-ok">'+w+'</span>':'<span class="diff-bad">'+w+'</span>').join(" ");
  const hit=e.filter(w=>g.includes(w)).length; return {html,close:hit>=e.length-1};}
function grade(gr){
  const q=flat[idx];
  pdHistory.push({idx,weakLen:weak.length});   // 記住評分前位置與弱句數，供「↩ 上一題」還原
  if(gr==="x"||gr==="w") weak.push({id:norm(q.expected).replace(/ /g,"").slice(0,24)||("pd"+idx),role:"self",
    zh:q.zh||"",en:q.expected,source:"pattern-drill_"+today(),vocab:[theme.label+"／"+q.seg],weak:true});
  idx++; drill();
}

// ---- 主題練完：算分 + 遺忘曲線 + weak JSON ----
function themeDone(){
  speechSynthesis.cancel();
  const graded=flat.filter(q=>q.type!=="echo").length, w=weak.length, right=graded-w;
  const pct=Math.round(right/graded*100);
  const days=pct>=90?7:pct>=70?3:1; const d=new Date(); d.setDate(d.getDate()+days);
  prog[theme.id]={next:d.toISOString().slice(0,10),score:pct}; saveProg();
  const allDone=THEMES.every(t=>prog[t.id]);
  const json=JSON.stringify(weak,null,1);
  el("app").innerHTML='<div class="done"><h2>🎉 '+theme.label+' 練完了</h2>'+
    '<div class="stat">共 <b>'+graded+'</b> 題（不含暖身）· 順 <b style="color:var(--ok)">'+right+'</b> · 要加強 <b style="color:var(--x)">'+w+'</b><br>得分 <b>'+pct+'%</b> → '+days+' 天後再排這主題複習</div>'+
    (allDone?'<div class="warnbox">🎉🎉 你把目前所有出國主題都練過一輪了！想加新主題跟 Claude 說。</div>':'')+
    (w?'<div class="lbl">要加強的句子（複製貼給 Claude → 存 Drive＋進單字卡 Pattern Drill 複習）</div><textarea id="out" readonly>'+json+'</textarea><button class="btn" onclick="PD.copyOut()">📋 複製 JSON</button>':'<p class="sub">全部都順，今天沒有要加強的 👏</p>')+
    (pdHistory.length?'<button class="btn alt" onclick="PD.prevItem()">↩ 回上一題</button>':'')+
    '<button class="btn alt" onclick="PD.open()">← 回主題選單</button></div>';
}
function copyOut(){const t=el("out");t.select();try{navigator.clipboard.writeText(t.value);}catch(e){document.execCommand("copy");}event.target.textContent="✓ 已複製";setTimeout(()=>event.target.textContent="📋 複製 JSON",1500);}

if(speechSynthesis.getVoices().length===0) speechSynthesis.onvoiceschanged=()=>{};

window.PD={open:home,start:start,drill:drill,toggleRec:toggleRec,replay:replay,showAnswer:showAnswer,grade:grade,nextItem:nextItem,prevItem:prevItem,copyOut:copyOut,setSpeed:setSpeed,reviewHome:reviewHome,reviewTheme:reviewTheme};
})();
</script>
</body>
