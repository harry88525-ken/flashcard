<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市場工作台</title>
<style>
  :root{
    --bg:#0e1117; --card:#161b22; --card2:#1c2230; --line:#2a3240;
    --txt:#e6edf3; --mut:#8b949e; --dim:#6e7681;
    --green:#16c784; --red:#ea3943; --blue:#3b82f6; --amber:#f0b90b;
    --r:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  header{padding:12px 16px 10px;border-bottom:1px solid var(--line);flex:0 0 auto;}
  h1{font-size:18px;font-weight:600;margin:0;}
  .sub{font-size:12px;color:var(--mut);margin:2px 0 12px;}
  .topnav{display:flex;gap:8px;max-width:720px;}
  .topbtn{flex:1;padding:12px 8px;border:1px solid var(--line);background:var(--card);color:var(--mut);
    border-radius:var(--r);font-size:15px;font-weight:600;cursor:pointer;transition:.15s;}
  .topbtn.on{background:var(--card2);color:var(--txt);border-color:var(--amber);}
  .topbtn .tag{display:block;font-size:11px;font-weight:400;color:var(--dim);margin-top:2px;}
  main{flex:1 1 auto;position:relative;min-height:0;}
  .pane{position:absolute;inset:0;display:none;}
  .pane.on{display:block;}
  iframe{width:100%;height:100%;border:0;background:var(--bg);display:block;}
  .empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;}
  .empty h2{font-size:20px;font-weight:600;margin:0 0 6px;}
  .empty p{font-size:13px;color:var(--mut);margin:0 0 20px;max-width:420px;line-height:1.7;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:460px;}
  .chip{border:1px dashed var(--line);color:var(--dim);border-radius:8px;padding:8px 12px;font-size:12px;}
  .empty .note{margin-top:18px;font-size:12px;color:var(--dim);}
</style>
</head>
<body>
  <header>
    <h1>市場工作台</h1>
    <p class="sub">美股 · 台股 · 加密貨幣　一站式</p>
    <div class="topnav">
      <button class="topbtn" data-m="us">美股<span class="tag">成交量榜</span></button>
      <button class="topbtn" data-m="tw">台股<span class="tag">VCP 選股</span></button>
      <button class="topbtn on" data-m="crypto">加密貨幣<span class="tag">工作台</span></button>
    </div>
  </header>

  <main>
    <div class="pane" id="pane-us">
      <iframe data-src="https://harry88525-ken.github.io/flashcard/us.html" title="美股成交量排名"></iframe>
    </div>

    <div class="pane" id="pane-tw">
      <iframe data-src="https://harry88525-ken.github.io/vcp-screener/" title="台股 VCP 選股"></iframe>
    </div>

    <div class="pane on" id="pane-crypto">
      <iframe data-src="https://harry88525-ken.github.io/flashcard/futures-calc.html" title="加密貨幣工作台"></iframe>
    </div>
  </main>

<script>
(function(){
  var btns=document.querySelectorAll('.topbtn');
  var panes={us:'pane-us',tw:'pane-tw',crypto:'pane-crypto'};
  function activate(m){
    btns.forEach(function(b){ b.classList.toggle('on', b.dataset.m===m); });
    Object.keys(panes).forEach(function(k){
      var el=document.getElementById(panes[k]);
      var on=(k===m); el.classList.toggle('on', on);
      if(on){ var f=el.querySelector('iframe'); if(f && !f.src && f.dataset.src) f.src=f.dataset.src; }
    });
    try{ location.hash=m; }catch(e){}
  }
  btns.forEach(function(b){ b.addEventListener('click',function(){ activate(b.dataset.m); }); });
  var start=(location.hash||'').replace('#','');
  activate(panes[start]?start:'crypto');   // 預設：加密貨幣（可改）
})();
</script>
</body>
</html>
